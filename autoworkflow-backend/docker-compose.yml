version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autoworkflow
      POSTGRES_USER: autoworkflow
      POSTGRES_PASSWORD: autoworkflow
    ports:
      - "5432:5432"
    volumes:
      - autoworkflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoworkflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/autoworkflow
      DB_USERNAME: autoworkflow
      DB_PASSWORD: autoworkflow
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-in-prod-min-256-bits-long-please}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-change-this-aes-256-key-32-bytes!!}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8080:8080"

volumes:
  autoworkflow_pgdata:
